<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolução dos escudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#F1ECE1;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
  }
  svg{display:block;width:100%;height:auto;max-width:1040px;}
</style>
</head>
<body>
<svg id="chart" viewBox="0 0 1000 545" xmlns="http://www.w3.org/2000/svg"></svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
// ---------------------------------------------------------------
// DADOS PADRÃO (usados se o CSV não carregar)
// ---------------------------------------------------------------
const CURRENT_YEAR = 2026;

const DEFAULT_ROWS = [
  { clube: "Club de Regatas Vasco da Gama", fundacao: 1898, hue: 345, sat: 55, id: "vasco-1899", label: "1º escudo (1899)", start: 1899, end: 1920 },
  { clube: "Club de Regatas Vasco da Gama", fundacao: 1898, hue: 345, sat: 55, id: "vasco-1920", label: "2º escudo (1920–atual)", start: 1920, end: null },
  { clube: "Clube Atlético Mineiro", fundacao: 1908, hue: 0, sat: 0, id: "cam-1910", label: "1º escudo (1910)", start: 1910, end: 1920 },
  { clube: "Clube Atlético Mineiro", fundacao: 1908, hue: 0, sat: 0, id: "cam-1920", label: "2º escudo (1920–atual)", start: 1920, end: null },
  { clube: "São Paulo Futebol Clube", fundacao: 1930, hue: 355, sat: 70, id: "spfc-1930", label: "Escudo único (1930–atual)", start: 1930, end: null },
];

function groupRowsIntoClubs(rows) {
  const byClub = new Map();
  rows.forEach(r => {
    if (!r.clube || !r.start) return;
    if (!byClub.has(r.clube)) {
      byClub.set(r.clube, {
        name: r.clube,
        founded: Number(r.fundacao),
        hue: Number(r.hue) || 0,
        sat: Number(r.sat) || 0,
        periods: []
      });
    }
    byClub.get(r.clube).periods.push({
      id: r.id,
      label: r.label,
      start: Number(r.start),
      end: (r.end === null || r.end === undefined || r.end === "") ? null : Number(r.end)
    });
  });
  byClub.forEach(club => club.periods.sort((a, b) => a.start - b.start));
  return Array.from(byClub.values());
}

let CLUBS = groupRowsIntoClubs(DEFAULT_ROWS);

// ---------------------------------------------------------------
// Layout
// ---------------------------------------------------------------
const VIEW_W = 1000, VIEW_H = 545;
const LABEL_COL_W = 280, RIGHT_PAD = 30, NAME_X = 0;
const CHART_W = VIEW_W - LABEL_COL_W - RIGHT_PAD;
const TOP_PAD = 50;
const MIN_YEAR = 1890, MAX_YEAR = 2028;
const MIN_W = 1.5, MAX_W = 60, GROWTH = 0.5;

function xScale(year) {
  return LABEL_COL_W + ((year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * CHART_W;
}

// Cálculo da espessura máxima: de 1900 até CURRENT_YEAR
function maxWidth() {
  const years = CURRENT_YEAR - 1900;
  return Math.min(MAX_W, Math.max(MIN_W, MIN_W + GROWTH * years));
}

// Distância entre linhas = largura máxima
const ROW_SPACING = maxWidth();
const ROW_H = ROW_SPACING;

function yCenter(i) {
  return TOP_PAD + i * ROW_SPACING + ROW_H / 2;
}

function widthFor(years) {
  return Math.min(MAX_W, Math.max(MIN_W, MIN_W + GROWTH * years));
}

function periodColor(hue, sat, idx, total) {
  const lightness = total === 1 ? 30 : 30 + (total - 1 - idx) * 18;
  const l = Math.min(70, Math.max(24, lightness));
  return sat === 0 ? `hsl(0,0%,${l}%)` : `hsl(${hue},${sat}%,${l}%)`;
}

// ---------------------------------------------------------------
// LÓGICA DE ACUMULAÇÃO POR ID (memória de espessura)
// ---------------------------------------------------------------
function buildSegments(periods) {
  // Mapa para guardar o total de anos já acumulados para cada ID
  const priorAccum = new Map();
  
  return periods.map((p, idx) => {
    const end = p.end === null ? CURRENT_YEAR : p.end;
    const duration = end - p.start;
    
    // Recupera o acumulado anterior para este ID (ou 0 se for a primeira vez)
    const startAccum = priorAccum.get(p.id) || 0;
    
    // Atualiza o acumulado para a próxima vez que este ID aparecer
    priorAccum.set(p.id, startAccum + duration);
    
    return { ...p, end, startAccum, idx };
  });
}

function ribbonPolygonPoints(seg, cy) {
  const steps = Math.max(2, Math.ceil((seg.end - seg.start)));
  const top = [], bottom = [];
  for (let i = 0; i <= steps; i++) {
    const t = seg.start + (seg.end - seg.start) * (i / steps);
    // Tempo total acumulado = acumulado anterior + tempo decorrido neste período
    const totalYears = seg.startAccum + (t - seg.start);
    const w = widthFor(totalYears) / 2;
    const x = xScale(t);
    top.push(`${x},${cy - w}`);
    bottom.push(`${x},${cy + w}`);
  }
  return top.concat(bottom.reverse()).join(" ");
}

// ---------------------------------------------------------------
// Quebra de linha automática estilo editor de texto
// ---------------------------------------------------------------
function wrapText(text, maxWidth, fontSize, fontFamily) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = `${fontSize}px "${fontFamily}"`;
  
  const words = text.split(' ');
  const lines = [];
  let currentLine = '';
  
  for (let i = 0; i < words.length; i++) {
    const testLine = currentLine ? currentLine + ' ' + words[i] : words[i];
    const metrics = ctx.measureText(testLine);
    
    if (metrics.width > maxWidth && currentLine) {
      lines.push(currentLine);
      currentLine = words[i];
    } else {
      currentLine = testLine;
    }
  }
  if (currentLine) {
    lines.push(currentLine);
  }
  return lines;
}

// ---------------------------------------------------------------
// Render
// ---------------------------------------------------------------
const svg = document.getElementById("chart");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}

function render(clubs) {
  svg.innerHTML = "";
  const totalHeight = TOP_PAD + clubs.length * ROW_SPACING + 55;
  svg.setAttribute("viewBox", `0 0 ${VIEW_W} ${totalHeight}`);

  // decade gridlines
  for (let y = 1890; y <= 2020; y += 10) {
    const x = xScale(y);
    svg.appendChild(el("line", {
      x1: x, y1: TOP_PAD - 15, x2: x, y2: TOP_PAD + clubs.length * ROW_SPACING + 10,
      stroke: "#D9D0BD", "stroke-width": 1
    }));
    svg.appendChild(el("text", {
      x: x, y: TOP_PAD - 22, "text-anchor": "middle", fill: "#7C7362", "font-size": "11"
    }, y));
  }

  // "hoje" marker
  const xNow = xScale(CURRENT_YEAR);
  svg.appendChild(el("line", {
    x1: xNow, y1: TOP_PAD - 15, x2: xNow, y2: TOP_PAD + clubs.length * ROW_SPACING + 10,
    stroke: "#241F1A", "stroke-width": 1, "stroke-dasharray": "3 4", opacity: 0.5
  }));

  const maxTextWidth = LABEL_COL_W - 20;

  clubs.forEach((club, i) => {
    const cy = yCenter(i);
    const segments = buildSegments(club.periods);

    // Quebra automática do nome
    const lines = wrapText(club.name, maxTextWidth, 14, 'Source Serif 4');
    const lineHeight = 18;
    const totalTextHeight = lines.length * lineHeight;
    const startY = cy - (totalTextHeight / 2) + 5;

    lines.forEach((line, idx) => {
      svg.appendChild(el("text", {
        x: NAME_X + 6, y: startY + idx * lineHeight,
        "font-size": "14", "font-weight": "600", fill: "#241F1A",
        "font-family": "'Source Serif 4', Georgia, serif"
      }, line));
    });

    // founding line
    const firstStart = club.periods[0].start;
    if (firstStart > club.founded) {
      svg.appendChild(el("line", {
        x1: xScale(club.founded), y1: cy, x2: xScale(firstStart), y2: cy,
        stroke: "#B0A793", "stroke-width": 3, "stroke-dasharray": "1 5", "stroke-linecap": "round"
      }));
    }

    // period ribbons (sem bolinhas)
    segments.forEach(seg => {
      const color = periodColor(club.hue, club.sat, seg.idx, segments.length);
      svg.appendChild(el("polygon", {
        points: ribbonPolygonPoints(seg, cy),
        fill: color
      }));
    });
  });

  // x-axis baseline
  const axisY = TOP_PAD + clubs.length * ROW_SPACING + 35;
  svg.appendChild(el("line", {
    x1: LABEL_COL_W, y1: axisY, x2: VIEW_W - RIGHT_PAD, y2: axisY,
    stroke: "#D9D0BD", "stroke-width": 1
  }));
}

// ---------------------------------------------------------------
// Tenta carregar o CSV automaticamente
// ---------------------------------------------------------------
fetch('escudos-dados.csv')
  .then(res => {
    if (!res.ok) throw new Error('Arquivo não encontrado');
    return res.text();
  })
  .then(csv => {
    const result = Papa.parse(csv, { header: true, skipEmptyLines: true, trimHeaders: false });
    if (result.data && result.data.length > 0) {
      const rows = result.data.map(r => ({
        clube: r["Clube"]?.trim(),
        fundacao: r["Fundação"]?.trim(),
        hue: r["Matiz (0-360)"]?.trim(),
        sat: r["Saturação (%)"]?.trim(),
        id: r["ID do desenho"]?.trim(),
        label: r["Rótulo do desenho"]?.trim(),
        start: r["Início"]?.trim(),
        end: r["Fim (vazio = atual)"]?.trim()
      })).filter(r => r.clube && r.start);
      
      if (rows.length > 0) {
        CLUBS = groupRowsIntoClubs(rows);
        render(CLUBS);
        console.log('✅ Dados carregados do CSV');
      }
    }
  })
  .catch(() => {
    console.log('📄 Usando dados padrão');
    render(CLUBS);
  });
</script>
</body>
</html>
